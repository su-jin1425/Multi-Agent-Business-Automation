$kind: http-request
name: Health Check
description: |-
  Returns the current liveness status of the API server.

  Calls `GET /health` — no authentication required. The response includes the
  application name, environment (development / production), semantic version, and
  a UTC timestamp. Use this endpoint to verify that the FastAPI process is running
  and reachable before sending authenticated requests.

  **Response schema** (`HealthResponse`):
  | Field | Type | Description |
  |---|---|---|
  | status | string | Always `"ok"` when the server is up |
  | environment | string | Active environment name from `ENVIRONMENT` env var |
  | version | string | Application version (currently `"1.0.0"`) |
  | timestamp | datetime | UTC time of the response |

  **Expected status:** `200 OK`
method: GET
url: '{{base_url}}/health'
order: 1000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Response has status ok', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('status');
          pm.expect(json.status).to.eql('ok');
      });
      pm.test('Response has environment field', function () {
          pm.expect(pm.response.json()).to.have.property('environment');
      });
      pm.test('Response has version field', function () {
          pm.expect(pm.response.json()).to.have.property('version');
      });
      pm.test('Response time under 2000ms', function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
