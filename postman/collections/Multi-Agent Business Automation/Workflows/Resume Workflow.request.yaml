$kind: http-request
name: Resume Workflow
description: |-
  Resumes a previously paused workflow.

  Calls `POST /workflows/{workflow_id}/resume` — **JWT Bearer token required**
  (roles: `admin`, `manager`). Transitions the workflow status from `paused`
  back to `running` (or `pending`, depending on service logic) and persists the
  change. The workflow will continue execution from where it was paused.

  **Path variable:**
  | Variable | Description |
  |---|---|
  | workflow_id | UUID of the paused workflow to resume |

  **Response schema** (`WorkflowRead`): updated workflow object with resumed status

  **Expected status:** `200 OK`
  **Error statuses:** `401 Unauthorized`, `403 Forbidden`, `404 Not Found`
method: POST
url: '{{base_url}}/api/v1/workflows/{{workflow_id}}/resume'
order: 8000
pathVariables:
  - key: workflow_id
    value: '{{workflow_id}}'
    description: UUID of the paused workflow to resume
