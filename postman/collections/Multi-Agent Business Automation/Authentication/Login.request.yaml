$kind: http-request
name: Login
description: |-
  Authenticates a user and returns a JWT Bearer token.

  Calls `POST /auth/login` — no authentication required. Accepts an email and
  password. On success the response contains an `access_token` (JWT), the token
  type (`bearer`), and the full user object. The token expires after the number
  of minutes configured in `ACCESS_TOKEN_EXPIRE_MINUTES` (default: 60).

  **Tip:** Copy the `access_token` value from the response and set it as the
  `{{token}}` collection variable so all subsequent requests are automatically
  authenticated.

  **Request body** (`LoginRequest`):
  | Field | Type | Required |
  |---|---|---|
  | email | string (email) | ✓ |
  | password | string | ✓ |

  **Response schema** (`TokenResponse`): `access_token`, `token_type`, `user`

  **Expected status:** `200 OK`
  **Error statuses:** `401 Unauthorized` (invalid credentials), `422 Unprocessable Entity` (validation failure)
method: POST
url: '{{base_url}}/api/v1/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@example.com",
      "password": "password123"
    }

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Response has access_token', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('access_token');
          pm.expect(json.access_token).to.be.a('string').and.not.empty;
      });
      pm.test('Response has token_type bearer', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('token_type');
          pm.expect(json.token_type.toLowerCase()).to.eql('bearer');
      });
      pm.test('Response has user object', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('user');
      });
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set('token', json.access_token);
      }
