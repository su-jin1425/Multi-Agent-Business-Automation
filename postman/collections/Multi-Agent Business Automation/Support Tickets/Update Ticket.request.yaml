$kind: http-request
name: Update Ticket
description: |-
  Updates the status, assigned agent, or response draft of an existing ticket.

  Calls `PUT /tickets/{ticket_id}` — **JWT Bearer token required** (roles:
  `admin`, `manager`, `support_executive`). All fields are optional; only the
  provided fields are updated. Use this endpoint to:
  - Transition a ticket through its lifecycle (`open` → `in_progress` → `resolved` → `closed`)
  - Assign or reassign the ticket to a specific agent
  - Save or revise the AI-generated response draft before sending it to the customer
  - Escalate a ticket by setting status to `escalated`

  **Path variable:**
  | Variable | Description |
  |---|---|
  | ticket_id | UUID of the ticket to update (set `{{ticket_id}}` collection variable) |

  **Request body** (`TicketUpdate`) — all fields optional:
  | Field | Type | Description |
  |---|---|---|
  | status | string | New ticket status (`open` / `in_progress` / `escalated` / `resolved` / `closed`) |
  | assigned_agent | string | Name of the agent to assign |
  | response_draft | string | Response text to save as the draft |

  **Response schema** (`TicketRead`): updated ticket object

  **Expected status:** `200 OK`
  **Error statuses:** `401 Unauthorized`, `403 Forbidden`, `404 Not Found`, `422 Unprocessable Entity`
method: PUT
url: '{{base_url}}/api/v1/tickets/{{ticket_id}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: ticket_id
    value: '{{ticket_id}}'
    description: UUID of the support ticket to update
body:
  type: json
  content: |-
    {
      "status": "in_progress",
      "assigned_agent": "Support Agent",
      "response_draft": "Thank you for reaching out. We have identified the issue with your password reset link and are working on a fix. Please try requesting a new reset link."
    }
