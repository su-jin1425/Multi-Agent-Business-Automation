$kind: http-request
name: Agent Performance
description: |-
  Returns per-agent execution performance metrics.

  Calls `GET /analytics/agent-performance` — **JWT Bearer token required**
  (roles: `admin`, `manager`, `analyst`). Aggregates task-level execution data
  from the database to produce a performance profile for each registered agent.
  Use this to identify slow or unreliable agents, compare framework performance
  (CrewAI vs AutoGen vs local fallback), and inform capacity planning.

  **Response schema** (array of `AgentPerformance`):
  | Field | Type | Description |
  |---|---|---|
  | agent_name | string | Human-readable agent name |
  | agent_type | string | Agent type (`finance`, `analytics`, `support`, `operations`) |
  | completed_tasks | integer | Total tasks completed successfully |
  | failed_tasks | integer | Total tasks that ended in failure |
  | average_latency_ms | float | Mean execution time in milliseconds across all completed tasks |

  **Expected status:** `200 OK`
  **Error statuses:** `401 Unauthorized`, `403 Forbidden`
method: GET
url: '{{base_url}}/api/v1/analytics/agent-performance'
order: 3000

scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Response is an array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
      pm.test('Each entry has agent_name and agent_type', function () {
          const data = pm.response.json();
          if (data.length > 0) {
              pm.expect(data[0]).to.have.property('agent_name');
              pm.expect(data[0]).to.have.property('agent_type');
          }
      });
